openapi: 3.0.3
info:
  title: Simple Commerce Catalog API
  version: 1.0.0
  description: Customer auth and read-only catalog benchmark API.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200': { description: Process is alive }
  /readyz:
    get:
      operationId: readiness
      responses:
        '200': { description: PostgreSQL is ready }
        '503': { description: PostgreSQL is unavailable }
  /api/v1/auth/customer/register:
    post:
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterCustomerRequest' }
      responses:
        '201': { description: Customer created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Email already exists }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginEnvelope' }
        '401': { description: Invalid credentials }
  /api/v1/auth/refresh-token:
    post:
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: Access token refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshTokenEnvelope' }
        '401': { description: Invalid or expired refresh token }
  /api/v1/auth/logout:
    post:
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '204': { description: Refresh token revoked }
        '401': { description: Invalid or already revoked refresh token }
  /api/v1/customer/me:
    get:
      operationId: getCurrentCustomer
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Authenticated customer profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerEnvelope' }
        '401': { description: Missing or invalid access token }
  /api/v1/category:
    get:
      operationId: listCategories
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryListEnvelope' }
  /api/v1/product:
    get:
      operationId: listProductsV1
      parameters:
        - $ref: '#/components/parameters/CategoryID'
        - $ref: '#/components/parameters/MinPrice'
        - $ref: '#/components/parameters/MaxPrice'
        - $ref: '#/components/parameters/Name'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortBy'
      responses:
        '200':
          description: PostgreSQL catalog result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListEnvelope' }
  /api/v1/product/{id}:
    get:
      operationId: getProductV1
      parameters:
        - $ref: '#/components/parameters/ProductID'
      responses:
        '200':
          description: PostgreSQL product result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductEnvelope' }
        '404': { description: Product not found }
  /api/v2/product:
    get:
      operationId: listProductsV2
      description: Same contract as v1; Redis is a best-effort cache.
      parameters:
        - $ref: '#/components/parameters/CategoryID'
        - $ref: '#/components/parameters/MinPrice'
        - $ref: '#/components/parameters/MaxPrice'
        - $ref: '#/components/parameters/Name'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortBy'
      responses:
        '200':
          description: Cached catalog result with PostgreSQL fallback
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListEnvelope' }
  /api/v2/product/{id}:
    get:
      operationId: getProductV2
      parameters:
        - $ref: '#/components/parameters/ProductID'
      responses:
        '200':
          description: Cached product result with PostgreSQL fallback
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductEnvelope' }
        '404': { description: Product not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProductID:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    CategoryID:
      in: query
      name: category_id
      schema: { type: integer, format: int64, minimum: 1 }
    MinPrice:
      in: query
      name: min_price
      schema: { type: number, minimum: 0 }
    MaxPrice:
      in: query
      name: max_price
      schema: { type: number, minimum: 0 }
    Name:
      in: query
      name: name
      schema: { type: string }
    Cursor:
      in: query
      name: cursor
      schema: { type: string }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SortBy:
      in: query
      name: sort_by
      schema: { type: string, enum: [newest, price_asc, price_desc], default: newest }
  responses:
    BadRequest:
      description: Invalid request
  schemas:
    RegisterCustomerRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        full_name: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }
    AccessToken:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token: { type: string }
        expires_in: { type: integer }
    LoginEnvelope:
      type: object
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        data: { $ref: '#/components/schemas/TokenPair' }
    RefreshTokenEnvelope:
      type: object
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        data: { $ref: '#/components/schemas/AccessToken' }
    Customer:
      type: object
      required: [id, email, full_name, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CustomerEnvelope:
      type: object
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        data: { $ref: '#/components/schemas/Customer' }
    Category:
      type: object
      required: [id, name, slug, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        created_at: { type: string, format: date-time }
    CategoryListEnvelope:
      type: object
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        data:
          type: array
          items: { $ref: '#/components/schemas/Category' }
    Product:
      type: object
      required: [id, category_id, sku, name, description, price, is_active, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        category_id: { type: integer, format: int64 }
        sku: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        next_cursor: { type: string }
    ProductEnvelope:
      type: object
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        data: { $ref: '#/components/schemas/Product' }
    ProductListEnvelope:
      type: object
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        data: { $ref: '#/components/schemas/ProductList' }
    Meta:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }
